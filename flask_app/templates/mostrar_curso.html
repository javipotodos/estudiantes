<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Curso</title>
</head>
<body>
    <h1>Estudiantes de {{ curso.nombre }}</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>
            {% for estudiante in curso.estudiantes %}
                <tr>
                    <td>{{ estudiante.nombre }}</td>
                    <td>{{ estudiante.apellido }}</td>
                    <td>{{ estudiante.edad }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="/cursos">Inicio</a></p>
</body>
</html>
